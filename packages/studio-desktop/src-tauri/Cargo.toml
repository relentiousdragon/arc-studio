[package]
name = "arc-studio-desktop"
version = "2026.1.1-nightly.9"
description = "ARC Studio desktop application"
license = "Apache-2.0"
authors = ["ARC Studio Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
discord-rich-presence = "1.1"
tauri-plugin-updater = "2"
