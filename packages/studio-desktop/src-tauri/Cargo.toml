[package]
name = "arc-studio-desktop"
version = "2026.1.1-nightly.11"
description = "ARC Studio desktop application"
license = "Apache-2.0"
authors = ["ARC Studio Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
bytes = "1"
keyring = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
discord-rich-presence = "1.1"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
