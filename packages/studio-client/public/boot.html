<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>ARC Studio</title>
    <style>
      :root {
        background: transparent;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
        background: transparent;
      }

      .boot-mark {
        display: grid;
        width: 112px;
        height: 112px;
        place-items: center;
        animation: boot-pulse 1.65s ease-in-out infinite;
        will-change: opacity;
      }

      .boot-mark img {
        display: block;
        width: 88px;
        height: 88px;
        object-fit: contain;
        filter: drop-shadow(0 0 24px rgb(158 119 255 / 25%));
      }

      @keyframes boot-pulse {
        0%,
        100% {
          opacity: .68;
        }

        50% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="boot-mark" role="img" aria-label="ARC Studio is starting">
      <img src="/arc.png" alt="">
    </div>
  </body>
</html>
