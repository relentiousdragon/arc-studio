<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARC Studio</title>
    <script>
      (() => {
        let theme = 'dark';
        try {
          const saved = localStorage.getItem('arc_theme');
          theme = saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.backgroundColor = theme === 'light' ? '#e9ebee' : '#14171b';
      })();
    </script>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; background: #14171b; }
      html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] #root { background: #e9ebee; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/components/prompts/DesktopPromptApp.jsx"></script>
  </body>
</html>
