name: Update README badges

on:
  push:
    branches: [main]
    paths:
      - README.md
  fork:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-badges
  cancel-in-progress: false

jobs:
  update-badges:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Refresh badge values and SVGs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-readme-badges.mjs

      - name: Commit updated badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/badges
          if git diff --cached --quiet; then
            echo "README badges are already current."
          else
            git commit -m "docs: refresh README badges [skip ci]"
            git push origin HEAD:refs/heads/main
          fi
